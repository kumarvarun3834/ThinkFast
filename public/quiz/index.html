<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Quiz - ThinkFast</title>

    <!-- Favicon and App Icons -->
    <link rel="icon" type="image/png" href="../favicon.png">
    <link rel="apple-touch-icon" href="../favicon.png">

    <!-- Social Preview (Open Graph) -->
    <meta property="og:title" content="Open Quiz - ThinkFast">
    <meta property="og:description" content="Click to open this quiz in the ThinkFast app or download the app to begin.">
    <meta property="og:image" content="https://thinkfast3834.web.app/favicon.png">
    <meta property="og:type" content="website">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0F172A;
            --card-color: #1E293B;
            --primary-accent: #3B82F6;
            --btn-color: #2563EB;
            --text-color: #E2E8F0;
            --label-color: #94A3B8;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            max-width: 500px;
            padding: 2rem;
            background-color: var(--card-color);
            border-radius: 24px;
            border: 1px solid #334155;
        }
        h2 { color: #fff; margin-bottom: 1rem; }
        p { color: var(--label-color); margin-bottom: 2rem; font-size: 0.9rem; }
        .btn {
            display: block;
            width: 100%;
            padding: 1rem;
            background-color: var(--btn-color);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            margin-bottom: 1rem;
            box-sizing: border-box;
        }
        .btn-outline {
            background-color: transparent;
            border: 1px solid var(--primary-accent);
            color: var(--primary-accent);
        }
        .logo { width: 80px; height: 80px; margin-bottom: 1rem; }

        /* Bottom Prompt Styles */
        #download-prompt {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--card-color);
            padding: 1rem 1.5rem;
            display: none; /* Hidden by default */
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            border-top: 2px solid var(--primary-accent);
            box-shadow: 0 -10px 25px rgba(0,0,0,0.5);
            z-index: 1000;
            animation: slideUp 0.5s ease-out;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .prompt-text {
            text-align: left;
            flex: 1;
        }
        .prompt-text span { font-weight: bold; color: white; display: block; }
        .prompt-text small { color: var(--label-color); font-size: 0.75rem; }
        .prompt-btn {
            background-color: var(--primary-accent);
            color: white;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            margin-left: 1rem;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="../favicon.png" alt="Logo" class="logo" style="filter: brightness(1.2);" onerror="this.src='https://thinkfast3834.web.app/favicon.png'; this.onerror=function(){this.src='https://img.icons8.com/color/144/brain.png';}">
        <h2>Ready for your Quiz?</h2>
        <p>If the app didn't open automatically, use the buttons below to continue your journey.</p>

        <a href="#" id="open-app-btn" class="btn">Open in ThinkFast App</a>
        <a href="https://thinkfast3834.web.app/download/app.apk" class="btn btn-outline">Install App (APK)</a>

        <div style="margin-top: 2rem; font-size: 0.8rem; color: #475569;">
            ID: <span id="quiz-id">...</span>
        </div>
    </div>

    <!-- Bottom Download Prompt -->
    <div id="download-prompt">
        <div class="prompt-text">
            <span>Get the ThinkFast App</span>
            <small>Better experience, real-time results, and AI wizardry.</small>
        </div>
        <a href="https://thinkfast3834.web.app/download/app.apk" class="prompt-btn">Download Now</a>
    </div>

    <script>
        // Extract quiz ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const quizId = urlParams.get('id');
        document.getElementById('quiz-id').innerText = quizId || 'None';

        // Deep link intent URL
        const appLink = window.location.href;
        document.getElementById('open-app-btn').href = appLink;

        // Detection and Prompt Logic
        function isMobile() {
            return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        }

        if (isMobile()) {
            // Show the bottom prompt on mobile web if they land here
            document.getElementById('download-prompt').style.display = 'flex';

            // Optional: Auto-try to launch app via custom scheme if https fails
            // This is hit-or-miss, but standard App Links usually handle it via OS.
            console.log("Mobile user detected. Prompting download.");
        }
    </script>
</body>
</html>
