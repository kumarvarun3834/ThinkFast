<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThinkFast - High Performance Quiz Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0F172A;
            --card-color: #1E293B;
            --primary-accent: #3B82F6;
            --btn-color: #2563EB;
            --text-color: #E2E8F0;
            --label-color: #94A3B8;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 2rem;
            background-color: var(--card-color);
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }
        h1 { margin-bottom: 0.5rem; font-size: 2.5rem; color: #fff; }
        p { color: var(--label-color); margin-bottom: 2rem; }
        .btn {
            display: inline-block;
            padding: 1rem 2rem;
            background-color: var(--btn-color);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            transition: transform 0.2s, background-color 0.2s;
            cursor: pointer;
            border: none;
            margin: 0.5rem;
        }
        .btn:hover { background-color: var(--primary-accent); transform: translateY(-2px); }
        .logo { width: 120px; height: 120px; margin-bottom: 1.5rem; }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://thinkfast3834.web.app/favicon.png" alt="Logo" class="logo" onerror="this.src='https://img.icons8.com/color/144/brain.png'">
        <h1>ThinkFast</h1>
        <p>A secure, AI-powered quiz platform for advanced learning and exam preparation.</p>

        <div id="mobile-only">
            <a href="https://thinkfast3834.web.app/download/app.apk" class="btn">Download Android App</a>
        </div>

        <a href="https://thinkfast3834.web.app/home" class="btn" style="background-color: transparent; border: 1px solid var(--primary-accent); color: var(--primary-accent);">Visit Web Dashboard</a>
    </div>
</body>
</html>
